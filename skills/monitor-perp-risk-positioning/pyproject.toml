[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-perp-risk-positioning"
version = "0.1.0"
description = "Read-only Hyperliquid and Aevo risk-positioning overlay."
requires-python = ">=3.11"
dependencies = [
  "cryptography==45.0.5",
  "httpx==0.28.1",
  "keyring==25.6.0",
  "pandas-market-calendars==5.4.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.21",
]

[project.scripts]
perp-risk = "perp_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
perp_risk = ["default-config.yaml", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
