  default_prompt: "Use $intraday-selection-postmortem to review the latest completed session selection-first: show what was selected correctly, what was selected incorrectly, which strong themes and movers were missed, and which signal caused each miss. Preserve LIVE/REPLAY/EXEC boundaries and keep infrastructure or execution issues in the internal audit unless they change selection attribution. Propose only evidence-bound sandbox hypotheses."
