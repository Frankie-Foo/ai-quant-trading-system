appId: cn.frank.ai-quant-research-desk
productName: AI量化研究台
asar: true
files:
  - dist/**/*
  - electron/analyst-main.cjs
  - electron/analyst-preload.cjs
  - electron/analyst/**/*
  - package.json
extraMetadata:
  main: electron/analyst-main.cjs
extraResources:
  - from: build/runtime/macos-research-runtime
    to: runtime/macos-research-runtime
  - from: build/bootstrap/research-bootstrap.zip
    to: bootstrap/research-bootstrap.zip
directories:
  output: release-macos-analyst
mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  icon: build/icon.png
dmg:
  sign: false
  title: AI量化研究台
